[package]
name = "oxidraft-macos"
description = "Oxidraft on macOS: the drawings Finder asks it to open"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Not the workspace's lints, whose unsafe_code is forbidden: this crate's
# work is AppKit's, which objc2 has no safe form for. Unsafe code is denied
# here too but for the blocks that need it, each allowed where it is and
# saying why it's sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSEnumerator",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
