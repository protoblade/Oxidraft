name: Release

# Push a tag like `v0.2.0` (matching the workspace version in Cargo.toml) to
# build every platform and publish a GitHub release. The app's updater looks
# for the assets by name: oxidraft-<version>-<target>.tar.gz (+ .sha256).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml builds into target.nosync (to keep iCloud out of it
  # locally); CI wants the standard location for packaging and caching.
  CARGO_TARGET_DIR: target
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Check the tag matches the Cargo version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the workspace version $version in Cargo.toml"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked -p oxidraft-app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version=${TAG#v}
          name="oxidraft-$version-${{ matrix.target }}"
          bin=oxidraft
          if [ "$RUNNER_OS" = "Windows" ]; then bin=oxidraft.exe; fi
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE-MIT LICENSE-APACHE staging/
          tar -czf "dist/$name.tar.gz" -C staging .
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Oxidraft ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
