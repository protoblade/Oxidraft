name: Release

# Push a tag like `v0.2.0` (matching the workspace version in Cargo.toml) to
# build every platform and publish a GitHub release. The app's updater looks
# for the assets by name: oxidraft-<version>-<target>.tar.gz (+ .sha256).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml builds into target.nosync (to keep iCloud out of it
  # locally); CI wants the standard location for packaging and caching.
  CARGO_TARGET_DIR: target
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Check the tag matches the Cargo version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the workspace version $version in Cargo.toml"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked -p oxidraft-app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version=${TAG#v}
          name="oxidraft-$version-${{ matrix.target }}"
          bin=oxidraft
          if [ "$RUNNER_OS" = "Windows" ]; then bin=oxidraft.exe; fi
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE-MIT LICENSE-APACHE staging/
          tar -czf "dist/$name.tar.gz" -C staging .
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      # Windows users get an installer and a portable zip besides the
      # .tar.gz the in-app updater uses.
      - name: Windows installer and zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          $bin = "target\${{ matrix.target }}\release"
          Compress-Archive -Path "$bin\oxidraft.exe", README.md, LICENSE-MIT, LICENSE-APACHE `
            -DestinationPath "dist\oxidraft-$version-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Qp "/DAppVersion=$version" "/DBinDir=$PWD\$bin" packaging\windows\oxidraft.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # Install silently, run the installed app, uninstall: nothing is
      # published unless this works.
      - name: Smoke-test the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          $dir = "$env:RUNNER_TEMP\oxidraft-install"
          Start-Process -Wait -FilePath "dist\Oxidraft-$version-windows-x64-setup.exe" `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          $out = "$env:RUNNER_TEMP\version.txt"
          Start-Process -Wait -NoNewWindow -FilePath "$dir\oxidraft.exe" -ArgumentList '--version' -RedirectStandardOutput $out
          $got = (Get-Content $out -Raw).Trim()
          if ($got -ne "oxidraft $version") { throw "The installed app reports '$got', expected 'oxidraft $version'" }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller hands off to a copy of itself, so allow it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\oxidraft.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\oxidraft.exe") { throw "Uninstalling left oxidraft.exe behind" }
          Write-Output "Installer OK: $got"

      - name: Checksums for the Windows extras
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          for f in *.zip *-setup.exe; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Oxidraft ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
